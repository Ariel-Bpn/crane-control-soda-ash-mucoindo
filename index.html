<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14181D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Crane Control</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
  --bg:#14181D;--bg2:#161B21;--panel:#1D232B;--panel2:#232A33;--line:#2C3540;--line2:#252D37;
  --tx:#E8ECEF;--tx2:#C9D1D9;--mut:#9AA6B2;--acc:#F5B400;--acc2:#FFD15C;
  --op:#F5B400;--sb:#7FB2E5;--is:#4A5561;--bd:#F07A5E;--ok:#5FD08A;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --cond:'Barlow Condensed','Arial Narrow',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--acc)}a:hover{color:var(--acc2)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.hidden{display:none!important}
.mono{font-family:var(--mono)}
.cond{font-family:var(--cond);font-weight:700;letter-spacing:.01em}
.mut{color:var(--mut)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- login ---------- */
#login{min-height:100vh;display:flex;flex-wrap:wrap}
.lg-left{flex:999 1 560px;min-width:0;padding:40px 48px 32px;display:flex;flex-direction:column;gap:22px;background:var(--bg2);border-right:1px solid var(--line)}
.lg-right{flex:1 1 380px;min-width:0;padding:40px 44px;display:flex;flex-direction:column;justify-content:center;gap:24px;background:var(--panel)}
.brand{display:flex;align-items:center;gap:10px}
.brand i{width:14px;height:14px;background:var(--acc);display:inline-block;flex:none}
.brand span{font-family:var(--mono);font-size:13px;letter-spacing:.18em;color:var(--tx2)}
.lg-title{margin:0;font-family:var(--cond);font-weight:700;font-size:clamp(46px,6vw,72px);line-height:.92;text-transform:uppercase}
.lg-title em{font-style:normal;color:var(--acc)}
.lg-sub{margin:4px 0 0;font-size:18px;color:var(--tx2);font-weight:500}
.showroom{background:#ECEEF0;border-radius:12px;padding:20px 20px 14px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;max-width:760px}
.showroom figure{margin:0;display:flex;flex-direction:column;gap:8px;min-width:0}
.showroom img{width:100%;height:auto;aspect-ratio:270/236;object-fit:contain;object-position:center bottom;display:block;mix-blend-mode:multiply}
.showroom figcaption{display:flex;justify-content:space-between;gap:8px;font-size:14px;color:#232A33;border-top:1px solid #C9CED4;padding-top:8px}
.showroom figcaption b{font-weight:600}
.showroom.mini{padding:12px;gap:10px;border-radius:8px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:auto}
.chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:13px;color:var(--tx2)}
.chip svg{stroke:var(--acc)}
.logo-box{width:56px;height:56px;border:1.5px dashed #4A5561;border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:10px;color:var(--mut);flex:none;overflow:hidden;background:var(--bg)}
.logo-box.has{border:none;background:#fff}
.logo-box img{width:100%;height:100%;object-fit:contain}
.pin-dots{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;max-width:340px}
.pin-dots span{height:52px;border-radius:6px;background:var(--bg);border:2px solid var(--line);display:flex;align-items:center;justify-content:center}
.pin-dots span.on{border-color:var(--acc)}
.pin-dots span.on::after{content:'';width:12px;height:12px;border-radius:50%;background:var(--acc)}
.pin-dots.err span{border-color:var(--bd)}
.pin-dots.err{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.keypad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;max-width:340px}
.keypad button{height:62px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);font-family:var(--mono);font-size:24px;cursor:pointer;display:flex;align-items:center;justify-content:center;touch-action:manipulation}
.keypad button:active{background:var(--line)}
.keypad button.txt{font-family:inherit;font-size:14px;color:var(--mut)}
.lg-msg{max-width:340px;min-height:52px;border-radius:8px;border:1px dashed #3A4552;color:var(--mut);display:flex;align-items:center;justify-content:center;text-align:center;padding:8px 12px;font-size:15px}
.lg-msg.err{border-style:solid;border-color:var(--bd);color:#FFB4A3}
.lg-foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;max-width:340px;font-size:13px;color:var(--mut)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--mut);flex:none}
.dot.ok{background:var(--ok)}.dot.busy{background:var(--acc);animation:pulse 1s ease-out infinite}.dot.err{background:var(--bd)}
@keyframes pulse{0%{opacity:1}100%{opacity:.3}}

/* drawn crane (fallback when GIFs are missing) */
.boom{transform-origin:0 0;transform:rotate(-42deg);animation:luff 14s ease-in-out infinite}
.counter{transform-origin:0 0;transform:rotate(42deg);animation:counter 14s ease-in-out infinite}
.hoist-line{transform-origin:0 0;transform:scaleY(140);animation:hoistL 10s ease-in-out infinite}
.hook{transform:translateY(140px);animation:hoistH 10s ease-in-out infinite}
.sway{transform-origin:0 0;animation:sway 5s ease-in-out infinite}
.beacon{animation:blink 1.2s steps(2,jump-none) infinite}
@keyframes luff{0%,100%{transform:rotate(-38deg)}50%{transform:rotate(-47deg)}}
@keyframes counter{0%,100%{transform:rotate(38deg)}50%{transform:rotate(47deg)}}
@keyframes hoistL{0%,100%{transform:scaleY(100)}50%{transform:scaleY(185)}}
@keyframes hoistH{0%,100%{transform:translateY(100px)}50%{transform:translateY(185px)}}
@keyframes sway{0%,100%{transform:rotate(1.5deg)}50%{transform:rotate(-1.5deg)}}
@keyframes blink{0%{opacity:1}100%{opacity:.15}}
@media (prefers-reduced-motion:reduce){.boom,.counter,.hoist-line,.hook,.sway,.beacon,.dot.busy{animation:none}}

/* ---------- app shell ---------- */
#app{display:flex;min-height:100vh}
#side{width:250px;flex:none;background:var(--bg2);border-right:1px solid var(--line);padding:24px 16px;display:flex;flex-direction:column;gap:20px;position:sticky;top:0;height:100vh;overflow-y:auto}
.proj{padding:14px;border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;gap:3px}
.proj small{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em}
.proj b{font-size:14px;font-weight:600}
.proj span{font-size:13px;color:var(--mut)}
.nav{display:flex;flex-direction:column;gap:3px}
.nav a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:6px;color:var(--tx2);text-decoration:none;font-size:15px;min-height:44px}
.nav a svg{stroke:var(--mut);flex:none}
.nav a:hover{background:var(--panel);color:var(--tx)}
.nav a.on{background:var(--panel2);color:var(--tx);font-weight:600}
.nav a.on svg{stroke:var(--acc)}
.me{margin-top:auto;padding:14px 6px 0;border-top:1px solid var(--line);display:flex;align-items:center;gap:12px}
.ava{width:38px;height:38px;border-radius:50%;background:var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:13px;color:var(--acc);flex:none}
.me div{display:flex;flex-direction:column;min-width:0;flex:1}
.me b{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me span{font-size:12px;color:var(--mut)}
#main{flex:1;min-width:0;padding:24px 32px 64px;display:flex;flex-direction:column;gap:22px}
.topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap}
.topbar .t{display:flex;flex-direction:column;gap:4px;min-width:0}
.h1{margin:0;font-family:var(--cond);font-weight:700;font-size:42px;text-transform:uppercase;line-height:1}
.tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#menuBtn{display:none}
#scrim{position:fixed;inset:0;background:rgba(8,10,13,.6);z-index:39}

/* ---------- parts ---------- */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px 20px;min-width:0}
.ph-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.h2{margin:0;font-size:14px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--tx2)}
.row{display:flex;flex-wrap:wrap;gap:16px}
.row>.panel{flex:1 1 340px}
.btn{min-height:44px;padding:0 16px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:500;text-decoration:none;color:var(--tx);white-space:nowrap}
.btn:hover{border-color:#3A4552;background:#29313B}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#14181D;font-weight:600}
.btn.pri:hover{background:var(--acc2)}
.btn.dgr{color:#FFB4A3;border-color:#5A2E26}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px}
.btn.ico{width:36px;min-height:36px;padding:0}
.btn svg{flex:none}
.pill{display:inline-flex;align-items:center;padding:3px 9px;border-radius:4px;font-size:12px;font-weight:600;color:#14181D;white-space:nowrap}
.tag{display:inline-flex;align-items:center;padding:2px 7px;border-radius:4px;font-size:12px;border:1px solid var(--line);color:var(--tx2);white-space:nowrap}
.tag.acc{border-color:var(--acc);color:var(--acc);font-family:var(--mono)}
.tag.warn{border-color:var(--bd);color:#FFB4A3}
.tag.ok{border-color:#2E6B45;color:var(--ok)}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:flex;flex-direction:column;gap:6px;min-width:0}
.kpi span{font-size:13px;color:var(--mut)}
.kpi b{font-family:var(--cond);font-weight:700;font-size:36px;line-height:1;overflow-wrap:anywhere}
.kpi b small{font-size:17px;color:var(--mut);font-weight:600}
.kpi i{font-style:normal;font-size:12px;color:var(--mut)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.ucard{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.ucard .img{height:132px;background:#ECEEF0;display:flex;align-items:center;justify-content:center}
.ucard .img img{max-height:124px;max-width:100%;object-fit:contain;mix-blend-mode:multiply}
.ucard .img .nofoto{color:#4A5561;font-size:13px}
.ucard .bd{padding:16px;display:flex;flex-direction:column;gap:10px;flex:1}
.ucard .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ucard .kode{font-family:var(--mono);font-weight:700;font-size:20px}
.ucard .meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:15px}
.ucard .area{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mut)}
.bar{height:8px;background:var(--bg2);border-radius:4px;overflow:hidden}
.bar>div{height:100%;background:var(--acc);border-radius:4px}
.mini3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding-top:10px;border-top:1px solid var(--line)}
.mini3 span{display:block;font-size:11px;color:var(--mut)}
.mini3 b{font-family:var(--mono);font-size:15px;font-weight:500}
.tbwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.tb{width:100%;border-collapse:collapse;font-size:14px}
.tb th{color:var(--mut);font-size:12px;font-weight:500;text-align:left;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tb td{padding:10px 8px;border-bottom:1px solid var(--line2);vertical-align:top}
.tb td.mono{white-space:nowrap}
.tb td.n,.tb th.n{text-align:right;font-family:var(--mono);white-space:nowrap}
.tb tr.sum td{font-weight:600;border-top:1px solid var(--line);border-bottom:none}
.tb .act{white-space:nowrap;text-align:right}
.empty{padding:28px 12px;text-align:center;color:var(--mut);font-size:14px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--tx2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:10px;border-radius:2px;display:inline-block}
.tl{display:flex;flex-direction:column;gap:10px;min-width:640px}
.tl-row{display:flex;gap:12px;align-items:center}
.tl-lab{width:76px;flex:none;font-family:var(--mono);font-size:14px;font-weight:700}
.tl-track{flex:1;position:relative;height:30px;background:var(--bg2);border-radius:4px;overflow:hidden}
.tl-seg{position:absolute;top:4px;bottom:4px;border-radius:3px;cursor:pointer;border:none;padding:0}
.tl-now{position:absolute;top:0;bottom:0;width:2px;background:var(--tx);pointer-events:none}
.tl-ax{flex:1;display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--mut)}
.fbar{display:grid;grid-template-columns:120px minmax(0,1fr) 120px;gap:12px;align-items:center;font-size:14px;margin-bottom:10px}
.fbar .t{height:12px;background:var(--bg2);border-radius:3px;overflow:hidden}
.fbar .t div{height:100%;background:var(--acc)}
.alerts{display:flex;flex-direction:column;gap:8px}
.alert{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:8px;background:#2A2019;border:1px solid #5A3E26;font-size:14px;color:#FFD9B8}
.alert svg{stroke:#FFB36B;flex:none;margin-top:1px}
.alert.info{background:#1B2531;border-color:#2F4660;color:#CFE3F7}
.alert.info svg{stroke:var(--sb)}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.filters label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mut)}
.filters input,.filters select{min-width:150px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:0}
.tabs button{background:none;border:none;border-bottom:2px solid transparent;padding:10px 14px;cursor:pointer;color:var(--mut);font-weight:500;min-height:44px}
.tabs button.on{color:var(--tx);border-bottom-color:var(--acc)}
.big{font-family:var(--cond);font-weight:700;font-size:38px;line-height:1}
.pos{color:var(--ok)}.neg{color:#FFB4A3}
.sumgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.sumgrid div{background:var(--bg2);border-radius:8px;padding:10px 12px}
.sumgrid span{display:block;font-size:12px;color:var(--mut)}
.sumgrid b{font-family:var(--mono);font-size:15px;font-weight:500}
.thumb{width:44px;height:44px;border-radius:4px;object-fit:cover;background:#fff;cursor:zoom-in;display:block}

/* ---------- forms ---------- */
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:9px 12px;width:100%;min-height:44px}
textarea{min-height:84px;resize:vertical}
input[type=file]{min-height:auto}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.f{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--tx2);min-width:0}
.f.full{grid-column:1/-1}
.f .req{color:var(--acc)}
.f .hint{font-size:12px;color:var(--mut)}
.phbox{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.phbox img{width:96px;height:72px;object-fit:cover;border-radius:6px;background:#fff}
#modal{position:fixed;inset:0;background:rgba(8,10,13,.72);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;z-index:60}
.mbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;width:100%;max-width:680px;padding:22px}
.mhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
.mhead h2{margin:0;font-family:var(--cond);font-weight:700;font-size:30px;text-transform:uppercase}
.mfoot{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.ferr{margin-top:14px;padding:10px 12px;border-radius:6px;background:#3A1F1A;border:1px solid #6E3326;color:#FFC9BC;font-size:14px}
.fnote{margin:-6px 0 14px;font-size:13px;color:var(--mut)}
.mtx{width:100%;border-collapse:collapse;font-size:14px}
.mtx th,.mtx td{padding:8px;border-bottom:1px solid var(--line2);text-align:left}
.mtx select{min-width:130px}
body.noscroll{overflow:hidden}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#E8ECEF;color:#14181D;padding:12px 18px;border-radius:8px;font-weight:500;z-index:80;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgba(0,0,0,.4)}
#zoom{position:fixed;inset:0;background:rgba(8,10,13,.9);z-index:90;display:flex;align-items:center;justify-content:center;padding:20px;cursor:zoom-out}
#zoom img{max-width:100%;max-height:100%;background:#fff}

/* ---------- small screens ---------- */
@media (max-width:900px){
  #side{position:fixed;left:0;top:0;z-index:40;transform:translateX(-102%);transition:transform .2s;height:100vh;height:100dvh}
  #side.open{transform:none}
  #menuBtn{display:inline-flex}
  #main{padding:16px 14px 80px}
  .h1{font-size:32px}
  .fgrid{grid-template-columns:minmax(0,1fr)}
  .lg-left{padding:28px 20px}
  .lg-right{padding:28px 20px 40px}
  .fbar{grid-template-columns:90px minmax(0,1fr) 100px}
  .mhead h2{font-size:24px}
  #modal{padding:12px 8px}
  .mbox{padding:18px 16px}
  .kpi b{font-size:30px}
}

/* ---------- print ---------- */
#print{display:none}
@media print{
  @page{size:A4;margin:11mm}
  html,body{background:#fff!important;color:#000}
  #login,#app,#modal,#toast,#zoom,#scrim{display:none!important}
  #print{display:block;color:#000;font-family:Arial,Helvetica,sans-serif;font-size:10.5pt}
  #print table{width:100%;border-collapse:collapse;margin:6px 0 12px}
  #print th,#print td{border:1px solid #555;padding:4px 5px;text-align:left;vertical-align:top}
  #print th{background:#EDEDED;font-size:9.5pt}
  #print td.n,#print th.n{text-align:right}
  #print .kop{display:flex;align-items:center;gap:12px;border-bottom:2.5px solid #000;padding-bottom:8px;margin-bottom:10px}
  #print .kop img{height:48px;width:auto}
  #print .kop .nm{font-size:14pt;font-weight:bold}
  #print .kop .pr{margin-left:auto;text-align:right;font-size:9.5pt}
  #print h1{font-size:13pt;text-align:center;margin:6px 0 2px;text-transform:uppercase}
  #print .sub{text-align:center;margin-bottom:10px}
  #print h2{font-size:11pt;margin:10px 0 2px}
  #print .ttd{display:flex;gap:10px;margin-top:18px;page-break-inside:avoid}
  #print .ttd div{flex:1;border:1px solid #555;height:96px;padding:5px;font-size:9.5pt;display:flex;flex-direction:column;justify-content:space-between}
  #print .foot{margin-top:8px;font-size:8.5pt;color:#444}
}
</style>
</head>
<body>
<!-- ================= LAYAR PIN ================= -->
<div id="login" class="hidden">
  <section class="lg-left">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap">
      <div class="brand"><i></i><span>CRANE CONTROL</span></div>
      <span class="mono mut" style="font-size:12px;border:1px solid var(--line);padding:6px 10px;border-radius:4px" id="lgVer"></span>
    </div>
    <div>
      <h1 class="lg-title">Kendali <em>Alat Berat</em><br>Crane</h1>
      <p class="lg-sub" id="lgProj"></p>
      <p class="mut" style="margin:2px 0 0" id="lgSub"></p>
    </div>
    <div id="lgShow"></div>

function hashPin(pin){ // cyrb53

  for (let i = 0; i < str.length; i++){ const ch = str.charCodeAt(i); h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677); }

  return (4294967296 * (2097151 & h2) + (h1>>>0)).toString(36);
}

  if (i >= 0){ const old = DB[t][i]; rec = Object.assign({}, old, rec); }
  else { rec.id = rec.id || uid(t.toLowerCase()); rec.createdAt = now; rec.createdBy = who; }
  rec.updatedAt = now; rec.updatedBy = who; rec._dirty = 1;
  if (i >= 0) DB[t][i] = rec; else DB[t].push(rec);

function scheduleSync(){ if (!syncUrl()) { setSync(); return; } clearTimeout(syncTimer); syncTimer = setTimeout(() => sync(false), 3000); setSync(); }
function setSync(state, msg){
  if (state) { SYNC_STATE = state; SYNC_MSG = msg || ''; }
  else if (!syncUrl()) SYNC_STATE = 'local';
  const p = pending();
  let label = 'Lokal saja', cls = '';
  if (SYNC_STATE === 'busy'){ label = 'Menyinkron…'; cls = 'busy'; }
  else if (SYNC_STATE === 'err'){ label = 'Gagal sinkron' + (p ? ' · ' + p + ' tertunda' : ''); cls = 'err'; }
  else if (SYNC_STATE === 'ok'){ label = p ? p + ' belum terkirim' : 'Tersinkron'; cls = p ? 'busy' : 'ok'; }
  else if (syncUrl()){ label = p ? p + ' belum terkirim' : 'Siap sinkron'; cls = ''; }
  document.querySelectorAll('[data-sync]').forEach(el => { el.innerHTML = `<i class="dot ${cls}"></i>${esc(label)}`; el.title = SYNC_MSG || label; });
  const ld = $('#lgDot'), ls = $('#lgSync'); if (ld){ ld.className = 'dot ' + cls; ls.textContent = label; }
}
async function sync(manual){
  const url = syncUrl(), token = syncTok();

  SYNCING = true; setSync('busy');
  const changes = {}, sent = {};
  TABLES.forEach(t => { const d = DB[t].filter(r => r._dirty); if (d.length){ changes[t] = d.map(r => { const c = Object.assign({}, r); delete c._dirty; sent[t + '|' + r.id] = r.updatedAt; return c; }); } });
  try {
    const res = await fetch(url, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify({token, action:'sync', since:META.lastSync || '', changes})});
    const j = await res.json();
    if (!j.ok) throw new Error(j.error || 'Server menolak');
    TABLES.forEach(t => DB[t].forEach(r => { if (r._dirty && sent[t + '|' + r.id] === r.updatedAt) delete r._dirty; }));
    let changed = false;
    Object.keys(j.data || {}).forEach(t => {
      if (!DB[t]) return;
      j.data[t].forEach(raw => {
        const row = normRow(t, raw); if (!row.id) return;
        const i = DB[t].findIndex(r => r.id === row.id);
        if (i < 0){ DB[t].push(row); changed = true; return; }
        const loc = DB[t][i];
        if (loc._dirty && String(loc.updatedAt) > String(row.updatedAt)) return;
        if (String(loc.updatedAt) !== String(row.updatedAt) || !!loc.deleted !== !!row.deleted){ DB[t][i] = row; changed = true; }
      });
    });
    META.lastSync = j.serverTime || META.lastSync; persist();
    setSync('ok');
    if (manual) toast('Sinkron selesai');
    if (changed){ if (SES) render(); else paintLogin(); }
    return true;
  } catch (e) {
    setSync('err', e.message); if (manual) toast('Gagal sinkron: ' + e.message, 4000); return false;
  } finally { SYNCING = false; }
}
</script>

function field(f, val){

    default: return `<label class="${cls}" for="${id}">${lab}<input id="${id}" data-k="${f.k}" type="${f.type||'text'}" value="${esc(v)}" ${f.type==='number'?'step="any" inputmode="decimal"':''} ${f.type==='tel'?'inputmode="tel"':''} placeholder="${esc(f.ph||'')}" ${f.max?`maxlength="${f.max}"`:''}>${hint}</label>`;
  }
}
function openForm(o){
  FORM = Object.assign({photos:{}}, o);
  const v = o.val || {};
  $('#modal').innerHTML = `<div class="mbox" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <div class="mhead"><h2 id="mTitle">${esc(o.title)}</h2><button type="button" class="btn ico" onclick="closeForm()" aria-label="Tutup">${ic('x')}</button></div>
    ${o.note ? `<p class="fnote">${o.note}</p>` : ''}
    <div class="fgrid">${o.fields.map(f => field(f, v[f.k])).join('')}</div>

    <button type="button" class="btn" onclick="closeForm()">Batal</button><button type="button" class="btn pri" onclick="formSave()">${o.saveLabel||'Simpan'}</button></div></div>`;
  $('#modal').classList.remove('hidden'); MODAL = true; document.body.classList.add('noscroll');

function closeForm(){
  const m = $('#modal'); const fresh = m.cloneNode(false); m.replaceWith(fresh);
  fresh.classList.add('hidden'); fresh.innerHTML = ''; MODAL = false; FORM = null; document.body.classList.remove('noscroll');

function formVals(){
  const o = {};
  document.querySelectorAll('#modal [data-k]').forEach(el => { let v = el.value; if (typeof v === 'string') v = v.trim(); if (el.type === 'number') v = v === '' ? '' : Number(v); o[el.dataset.k] = v; });
  return Object.assign(o, FORM.photos);
}
const fval = k => { const el = document.querySelector(`#modal [data-k="${k}"]`); return el ? el.value : ''; };
const fset = (k, v) => { const el = document.querySelector(`#modal [data-k="${k}"]`); if (el) el.value = v; };
function ferr(msg){ const e = $('#fErr'); e.textContent = msg; e.classList.remove('hidden'); e.scrollIntoView({block:'nearest'}); return false; }
function formSave(){
  const v = formVals();
  for (const f of FORM.fields){ if (f.req && (v[f.k] === '' || v[f.k] == null)) return ferr(`"${f.label}" wajib diisi.`); }
  const err = FORM.onSave(v);
  if (err) return ferr(err);
  closeForm(); render();
}
function formDelete(){ const fn = FORM.onDelete; closeForm(); fn(); }
async function formPhoto(k, input){
  const f = input.files && input.files[0]; if (!f) return;
  try { const d = await compressImg(f, FORM.logoMode ? 'png' : 'jpeg'); FORM.photos[k] = d; const im = $('#pv_' + k); im.src = d; im.classList.remove('hidden'); $('#pr_' + k).classList.remove('hidden'); }
  catch (e) { toast('Foto tidak bisa dibaca'); }
}
function formPhotoClear(k){ FORM.photos[k] = ''; $('#pv_' + k).classList.add('hidden'); $('#pr_' + k).classList.add('hidden'); }
function compressImg(file, fmt){
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => { const im = new Image(); im.onload = () => {
      let w = fmt === 'png' ? 220 : 520, q = .72, out = '';
      for (let i = 0; i < 10; i++){
        const s = Math.min(1, w / Math.max(im.width, im.height));
        const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(im.width*s)); c.height = Math.max(1, Math.round(im.height*s));
        const x = c.getContext('2d'); if (fmt !== 'png'){ x.fillStyle = '#fff'; x.fillRect(0,0,c.width,c.height); }
        x.drawImage(im, 0, 0, c.width, c.height);
        out = fmt === 'png' && i < 3 ? c.toDataURL('image/png') : c.toDataURL('image/jpeg', q);
        if (out.length <= 44000) break; w = Math.round(w*.82); q = Math.max(.4, q - .07);
      }
      res(out); }; im.onerror = rej; im.src = fr.result; };
    fr.onerror = rej; fr.readAsDataURL(file);
  });
}

<script>
const PAGES = {};

/* ---------- perhitungan bersama ---------- */
const segsOf = (d, uId) => rows('GERAK').filter(g => g.tanggal === d && (!uId || g.unit === uId)).sort((a,b) => String(a.mulai).localeCompare(String(b.mulai)));
function statusNow(d, uId){
  const s = segsOf(d, uId); if (!s.length) return '';
  if (d === today()){ const n = nowHM(); const c = s.find(x => x.mulai <= n && n < x.selesai); if (c) return c.status; }
  return s[s.length-1].status;
}
const jamStatus = (segs, st) => segs.filter(g => g.status === st).reduce((a,g) => a + dur(g), 0);
const fotoUnit = u => u.foto || (/rough/i.test(u.jenis||'') ? GIF_RT : GIF_AT);
const tonTag = u => u.tonase ? `<span class="tag acc">${n1(u.tonase)} T</span>` : `<span class="tag acc" title="Tonase belum diisi">[__] T</span>`;
function saldo(t){ return rows(t).reduce((a,r) => a + (r.jenis === 'Masuk' ? 1 : -1) * (Number(r.jumlah)||0), 0); }
function certInfo(k){
  if (!k.berlaku) return {txt:'Belum diisi', cls:''};
  const d = Math.round((new Date(k.berlaku + 'T00:00:00Z') - new Date(today() + 'T00:00:00Z')) / 864e5);
  if (d < 0) return {txt:'Kedaluwarsa ' + tgl(k.berlaku), cls:'warn', bad:true};
  if (d <= 30) return {txt:'Habis ' + d + ' hari lagi', cls:'warn', soon:true};
  return {txt:'s.d. ' + tgl(k.berlaku), cls:'ok'};
}
function timeline(d, list){
  const all = segsOf(d).filter(g => list.some(u => u.id === g.unit));
  let a = 6, b = 18;
  all.forEach(g => { a = Math.min(a, Math.floor(hrs(g.mulai))); b = Math.max(b, Math.ceil(hrs(g.selesai))); });
  if ((b - a) % 2) b++;
  const span = b - a, pct = h => ((h - a) / span * 100).toFixed(2) + '%';

  const nowH = hrs(nowHM()), showNow = d === today() && nowH > a && nowH < b;

      ${showNow ? `<div class="tl-now" style="left:${pct(nowH)}"></div>` : ''}</div></div>`;
  }).join('');
  return `<div class="tbwrap"><div class="tl"><div class="tl-row"><span class="tl-lab"></span><div class="tl-ax">${ticks.join('')}</div></div>${rowsH}
    ${showNow ? `<div class="tl-row"><span class="tl-lab"></span><div style="flex:1;position:relative;height:16px"><span class="mono" style="position:absolute;left:${pct(nowH)};transform:translateX(-50%);font-size:11px">sekarang ${nowHM()}</span></div></div>` : ''}</div></div>`;
}
const LEGEND = `<div class="legend">${STATUS.map(s => `<span><i style="background:${SCOL[s]}"></i>${s}</span>`).join('')}</div>`;

/* ================= BERANDA ================= */
PAGES.beranda = () => {
  const d = VIEW.date, U = units(), site = U.filter(u => (u.statusSite||'On site') === 'On site');
  const segs = segsOf(d);
  const jamOp = jamStatus(segs, 'Operasi'), lift = segs.reduce((a,g) => a + (Number(g.lift)||0), 0);
  const ts = rows('TS').filter(t => t.tanggal === d);

    if (!syncUrl()) al.push(['info', 'Aplikasi belum tersambung ke Google Sheets — data baru tersimpan di perangkat ini. Isi alamat sinkron di Pengaturan › Sinkron & cadangan.']);
  }
  const kc = rows('KRU').filter(k => k.aktif !== false).map(k => [k, certInfo(k)]).filter(x => x[1].bad || x[1].soon);

    h += `<section class="panel" style="display:flex;flex-wrap:wrap;gap:24px;align-items:center">

      <div style="flex:1 1 280px;display:flex;flex-direction:column;gap:12px"><h2 class="cond" style="margin:0;font-size:32px;text-transform:uppercase">Belum ada unit crane</h2>
      <p class="mut" style="margin:0">Mulai dengan mendaftarkan unit crane di lokasi (kode unit, jenis, tonase). Setelah itu kru, jam pergerakan dan BBM bisa dicatat per unit.</p>
      <div style="display:flex;gap:10px;flex-wrap:wrap">${lv('unit')>=2?btn('Tambah unit crane',"formUnit()",'pri','plus'):''}${SES.peran==='pc'?btn('Muat data contoh',"muatContoh()"):''}</div></div></section>`;
    return h;
  }

  // hero + kpi
  const sChips = ['Operasi','Standby','Istirahat','Breakdown','Belum dicatat'].filter(s => cnt[s]).map(s => `<span class="pill" style="background:${SCOL[s]||'#3A4552'};color:${s==='Istirahat'||s==='Belum dicatat'?'#E8ECEF':'#14181D'}">${cnt[s]} ${s}</span>`).join(' ');
  const tiles = [
    ['Jam operasi', n1(jamOp), 'jam', segs.length ? 'Total semua unit' : 'Belum ada catatan pergerakan'],
    ['Pergerakan / angkatan', String(lift), 'kali', 'Dicatat per pergerakan'],
    ['Kru bertugas', String(kru.size), 'orang', ts.length + ' timesheet unit'],
    ['BBM diisi', n1(bbm), 'liter', bbmD.length + ' kali pengisian']
  ];
  if (lv('petty') >= 1) tiles.push(['Saldo petty cash', rpS(saldo('PETTY')), '', 'Kas kecil di lokasi']);
  if (lv('kas') >= 1) tiles.push(['Saldo kas proyek', rpS(saldo('KAS')), '', 'Semua periode']);

function formTS(id){

  openForm({title: id ? 'Ubah timesheet' : 'Timesheet kru & hour meter', val:t,

    fields:[
      {k:'tanggal',label:'Tanggal',type:'date',req:true},{k:'unit',label:'Unit crane',type:'select',req:true,options:U.map(u => [u.id, u.kode + ' · ' + u.jenis])},
      {k:'shift',label:'Shift',type:'select',req:true,options:['Siang','Malam']},{k:'operator',label:'Operator',type:'select',req:true,options:byJab('Operator').length ? byJab('Operator') : any},
      {k:'rigger',label:'Rigger',type:'select',options:byJab('Rigger').length ? byJab('Rigger') : any},{k:'helper1',label:'Helper 1',type:'select',options:byJab('Helper').length ? byJab('Helper') : any},
      {k:'helper2',label:'Helper 2',type:'select',options:byJab('Helper').length ? byJab('Helper') : any},{k:'signalman',label:'Signalman (bila ada)',type:'select',options:byJab('Signalman').length ? byJab('Signalman') : any},
      {k:'hmAwal',label:'HM awal',type:'number'},{k:'hmAkhir',label:'HM akhir',type:'number'},
      {k:'catatan',label:'Catatan',type:'textarea',full:true}

}

function ledger(t){

  let s = 0; all.forEach(r => { s += (r.jenis === 'Masuk' ? 1 : -1) * (Number(r.jumlah)||0); r._saldo = s; });
  return all;
}

  if (arr.length) h += `<section class="panel"><div class="ph-head"><h2 class="h2">Pengeluaran per pos biaya</h2></div>${arr.map(([p,v]) => `<div class="fbar"><span>${esc(p)}</span><div class="t"><div style="width:${(v/mx*100).toFixed(0)}%"></div></div><span class="mono" style="text-align:right">${rpS(v)}</span></div>`).join('')}</section>`;

  </tbody></table></div></section>`;

}

const PS = 'border:1px solid #999;padding:5px 6px;text-align:left;vertical-align:top';

function csv(name, head, body){

}

function pulihkan(input){

    } catch (e) { toast('Gagal membaca cadangan: ' + e.message, 4000); }
  };
  fr.readAsText(f);
}
function resetLokal(){
  if (pending() && !confirm(pending() + ' data belum terkirim ke server dan akan HILANG. Lanjutkan?')) return;
  if (!confirm('Kosongkan semua data di perangkat ini?')) return;
  localStorage.removeItem(STORE_KEY); localStorage.removeItem(SES_KEY); location.reload();
}

function hapusContoh(){
  if (!confirm('Hapus semua data contoh?')) return;
  TABLES.forEach(t => DB[t].filter(r => r.contoh && !r.deleted).forEach(r => save(t, {id:r.id, deleted:true}, true)));
  scheduleSync(); toast('Data contoh dihapus'); render();
}

/* ================= MULAI ================= */
function boot(){
  loadStore();
  VIEW.date = today(); VIEW.month = today().slice(0,7); VIEW.lapDate = today(); VIEW.lapTo = today(); VIEW.lapFrom = today().slice(0,8) + '01';
  buildKeypad();
  let s = null; try { s = JSON.parse(localStorage.getItem(SES_KEY) || 'null'); } catch (e) {}
  const u = s && byId('USER', s.id);
  if (s && u && !u.deleted && u.aktif !== false && Date.now() - s.t < 12*3600e3){ SES = s; enterApp(); }
  else { $('#login').classList.remove('hidden'); paintLogin(); }
  if (syncUrl()) setTimeout(() => sync(false), 800);
  setInterval(() => { if (syncUrl()) sync(false); }, 60000);
  setInterval(() => { if (SES && !MODAL && ['beranda','gerak'].includes(PAGE) && VIEW.date === today()) render(); }, 60000);
  window.addEventListener('online', () => sync(false));
  document.addEventListener('visibilitychange', () => { if (!document.hidden && syncUrl()) sync(false); });
  setSync();
}
boot();
